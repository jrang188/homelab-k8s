## Argo CD configuration
## Ref: https://github.com/argoproj/argo-cd
##
## Only overrides from the argo-cd chart's own defaults belong here.
## Everything else falls through to the chart's built-in values.

argo-cd:
  configs:
    params:
      # argocd-server serves the web UI (HTTP/1.1) and gRPC (HTTP/2) on one
      # port over its own self-signed TLS by default. The Tailscale operator
      # terminates TLS at its own tailnet-facing proxy and forwards
      # cleartext, so the backend must stop doing TLS itself — otherwise
      # it would be double-terminating and the UI/gRPC-Web would break.
      server.insecure: true

      # Defaults (20/10) are sized for fleets managing many clusters/apps.
      # This homelab has a handful of Applications; fewer processors means
      # less concurrent cluster-cache/reconciliation work in memory on
      # control-plane nodes that are already memory-constrained (4GB VMs
      # running etcd).
      controller.status.processors: "10"
      controller.operation.processors: "5"

    cm:
      # Chart default exclusions (kept, so we don't lose them by overriding
      # this key) plus v1 Event, which isn't excluded upstream but is one of
      # the highest-churn object types in any cluster and was inflating the
      # application-controller's in-memory cluster cache.
      resource.exclusions: |
        - apiGroups:
          - ''
          kinds:
          - Event
        - apiGroups:
          - ''
          - discovery.k8s.io
          kinds:
          - Endpoints
          - EndpointSlice
        - apiGroups:
          - coordination.k8s.io
          kinds:
          - Lease
        - apiGroups:
          - authentication.k8s.io
          - authorization.k8s.io
          kinds:
          - SelfSubjectReview
          - TokenReview
          - LocalSubjectAccessReview
          - SelfSubjectAccessReview
          - SelfSubjectRulesReview
          - SubjectAccessReview
        - apiGroups:
          - certificates.k8s.io
          kinds:
          - CertificateSigningRequest
        - apiGroups:
          - cert-manager.io
          kinds:
          - CertificateRequest
        - apiGroups:
          - cilium.io
          kinds:
          - CiliumIdentity
          - CiliumEndpoint
          - CiliumEndpointSlice
        - apiGroups:
          - kyverno.io
          - reports.kyverno.io
          - wgpolicyk8s.io
          kinds:
          - PolicyReport
          - ClusterPolicyReport
          - EphemeralReport
          - ClusterEphemeralReport
          - AdmissionReport
          - ClusterAdmissionReport
          - BackgroundScanReport
          - ClusterBackgroundScanReport
          - UpdateRequest

  # Memory requests/limits for the components we've actually measured live
  # (controller, repo-server, server, applicationset). Control-plane nodes
  # are 4GB VMs running etcd; these were previously unbounded, so nothing
  # stopped a runaway pod from pressuring etcd/kube-apiserver on the same
  # node. Requests are set near observed steady-state usage so the
  # scheduler bin-packs correctly; limits leave headroom above that but
  # still cap growth.
  controller:
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        memory: 1536Mi

    # Exposes argocd_app_info (sync/health status) and argocd_app_sync_total
    # — scraped by templates/vmservicescrape.yaml below for the sync/health
    # alerts in templates/vmrule.yaml. Just the metrics Service; no
    # ServiceMonitor (this cluster doesn't have the prometheus-operator CRD
    # installed, only the VictoriaMetrics operator's own VMServiceScrape).
    metrics:
      enabled: true

  repoServer:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi

  applicationSet:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 192Mi

  server:
    service:
      # Was NodePort (Klipper) before Ingress existed for this cluster; now
      # fronted by the Tailscale operator's proxy, so ClusterIP is enough.
      type: ClusterIP

    ingress:
      # Operator-only tool — deliberately NOT on the public Traefik/
      # Cloudflare path. ingressClassName: tailscale puts this on the
      # tailnet only (MagicDNS name + Tailscale-issued TLS cert), same
      # policy as Hermes Agent (see CONTEXT.md) and Grafana. Only apps
      # meant to be shown off publicly should ever get ingressClassName:
      # traefik + a cert-manager/cloudflare annotation.
      enabled: true
      ingressClassName: tailscale
      hostname: argocd
      tls: true

    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 256Mi
