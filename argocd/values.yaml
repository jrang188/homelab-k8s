## Argo CD configuration
## Ref: https://github.com/argoproj/argo-cd
##
## Only overrides from the argo-cd chart's own defaults belong here.
## Everything else falls through to the chart's built-in values.

argo-cd:
  configs:
    params:
      # argocd-server serves the web UI (HTTP/1.1) and gRPC (HTTP/2) on one
      # port over its own self-signed TLS by default. Traefik terminates
      # TLS at the edge (cert-manager-issued cert) and forwards cleartext,
      # so the backend must stop doing TLS itself — otherwise Traefik would
      # be double-terminating and the UI/gRPC-Web would break. Per ArgoCD's
      # own Traefik ingress docs.
      server.insecure: true

  server:
    service:
      # Was NodePort (Klipper) before Ingress existed for this cluster; now
      # fronted by Traefik, so ClusterIP is enough.
      type: ClusterIP

    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: argocd.sirwayne.xyz
      annotations:
        cert-manager.io/cluster-issuer: cloudflare
      tls: true
