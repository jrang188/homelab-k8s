# This repo has no CI (see AGENTS.md) — a synced Application actually
# reaching a healthy state in the cluster is the only real verification a
# push worked. `for:` windows are deliberately generous: ADR-0009
# (selfheal-over-sync-waves) documents that transient OutOfSync/Degraded
# states are expected and self-resolve within a few sync cycles on bootstrap
# or a full redeploy — these alerts should only fire once that's had time to
# happen and clearly hasn't.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: argocd-custom
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: argocd-custom
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: An ArgoCD Application has been OutOfSync for 30m+
            description: >-
              {{`{{ $labels.name }}`}} has been OutOfSync for over 30
              minutes — longer than normal sync-cycle convergence.
          record: ""
        - alert: ArgoCDAppHealthDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: An ArgoCD Application is Degraded
            description: >-
              {{`{{ $labels.name }}`}} has been Degraded for over 20
              minutes.
          record: ""
        - alert: ArgoCDAppSyncFailed
          expr: increase(argocd_app_sync_total{phase=~"Error|Failed"}[10m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: An ArgoCD Application sync attempt failed
            description: >-
              {{`{{ $labels.name }}`}} had a failed sync attempt
              ({{`{{ $labels.phase }}`}}) in the last 10m.
          record: ""
