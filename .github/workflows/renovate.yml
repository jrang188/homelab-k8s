name: Renovate
# Self-hosted Renovate via the official github-action: bumps upstream chart pins in
# Chart.yaml and regenerates Chart.lock via `helm dependency update` (the action's
# container ships helm).
# Rationale: docs/research/2026-08-21-renovate-vs-dependabot-for-helm.md
#
# NOTE: the previous version put `container: renovatebot/renovate` at the job level and
# ran actions/checkout *inside* that non-root container, which crashed with
# EACCES on /__w/_temp/_runner_file_commands and never ran Renovate (0 green runs).
# The official action checks out on the host runner (root) and launches renovate's
# container itself, so checkout works and Renovate gets the repo.

on:
  schedule:
    - cron: '0 * * * *' # hourly; Renovate rate-limits itself, this is just the tick
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'info'

# Least-privilege for the default GITHUB_TOKEN: only actions/checkout uses it,
# and it needs read-only. Renovate authenticates via secrets.RENOVATE_TOKEN
# (NOT GITHUB_TOKEN) to open PRs, so this job never needs GITHUB_TOKEN write.
permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Renovate
        uses: renovatebot/github-action@v46.2.4
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
