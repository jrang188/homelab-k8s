# Cluster-local Service exposing Valkey to SearXNG only (default ClusterIP).
# Not exposed to the tailnet — the limiter store is internal to the
# searxng namespace and reachable at valkey://valkey:6379/0.
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: searxng
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: valkey
spec:
  selector:
    app: valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis