# ClusterIP, reached in-cluster by Traefik (infra/traefik) via the Ingress in
# ingress.yaml. Never a LoadBalancer — public traffic enters only through the
# Cloudflare-fronted Traefik path (ADR-0005).
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: searxng
spec:
  selector:
    app: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
