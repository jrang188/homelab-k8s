# Valkey — in-namespace store backing SearXNG's instance-level rate limiter
# (server.limiter, driven by SEARXNG_LIMITER/SEARXNG_VALKEY_URL in
# deployment.yaml). Limiter buckets are transient state, so this is an
# ephemeral redis, deliberately: no PVC, no persistence (RDB/appendonly
# disabled via `--save ""`), and a restart merely resets limiter counters —
# equivalent to what a SearXNG restart would do.
#
# Runs as the image's redis user (uid 999; the image declares no User and
# starts as root, so k8s forces non-root via runAsNonRoot/runAsUser). Because
# persistence is off and `--save ""` disables RDB writes, it never writes to
# /data, so no volume or ownership handling is needed.
# Hardened per the repo's posture (ADR-0010/0012): all capabilities dropped,
# no privilege escalation. Pinned to the home node to stay co-located with
# the searxng workload it backs (ADR-0002).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: searxng
  labels:
    app: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      nodeSelector:
        topology.kubernetes.io/zone: home
      tolerations:
        - key: node-role.kubernetes.io/home
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: valkey
          image: valkey/valkey:7.2-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # `--save ""` keeps it ephemeral (no RDB snapshots). appendonly is
          # off by default. The image's redis user owns /data but we never
          # write there, so no emptyDir mount is required.
          args: ["valkey-server", "--save", ""]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi