# Provisions the `searxng-secret` Secret consumed by the Deployment's
# SEARXNG_SECRET env var, and (via the render-settings initContainer) the
# /metrics Basic Auth password baked into settings.yml at pod start — see
# deployment.yaml and settings-configmap.yaml. Sourced from 1Password via
# ESO's cluster-scoped `onepassword` ClusterSecretStore — see CONTEXT.md's
# secrets bootstrap contract and infra/eso.
#
# Out-of-band setup: a 1Password item named `searxng-secret` (vault
# `Development`, matching infra/eso's ClusterSecretStore) with two fields:
#   - `secret`: the SEARXNG_SECRET value (e.g. `openssl rand -base64 32`)
#   - `open-metrics-password`: the /metrics Basic Auth password (e.g.
#     `openssl rand -hex 24`) — only the password is validated by SearXNG,
#     the Basic Auth username is unchecked, so this one field covers both
#     halves of vmservicescrape.yaml's basicAuth.
# Until both exist this ExternalSecret stays SecretSyncedError and the pod
# won't start — same pattern as cloudflare-api-token / tailscale-operator-oauth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-secret
  namespace: searxng
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: searxng-secret
  data:
    - secretKey: SEARXNG_SECRET
      remoteRef:
        key: searxng-secret/secret
    - secretKey: OPEN_METRICS_PASSWORD
      remoteRef:
        key: searxng-secret/open-metrics-password
