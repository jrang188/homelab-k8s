# Provisions the `searxng-secret` Secret consumed by the Deployment's
# SEARXNG_SECRET env var (deployment.yaml). Sourced from 1Password via ESO's
# cluster-scoped `onepassword` ClusterSecretStore — see CONTEXT.md's secrets
# bootstrap contract and infra/eso.
#
# Out-of-band setup: a 1Password item named `searxng-secret` (vault
# `Development`, matching infra/eso's ClusterSecretStore) with a field named
# `secret` holding the secret key (e.g. `openssl rand -base64 32`). Until it
# exists this ExternalSecret stays SecretSyncedError and the pod won't start —
# same pattern as cloudflare-api-token / tailscale-operator-oauth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-secret
  namespace: searxng
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: searxng-secret
  data:
    - secretKey: SEARXNG_SECRET
      remoteRef:
        key: searxng-secret/secret
