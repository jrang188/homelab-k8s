# SearXNG settings. The image's entrypoint normally generates settings.yml
# from a template on first boot (which leaves search.formats = [html] only);
# Hermes' web search provider calls /search?format=json, so the JSON format
# MUST be enabled or it gets a 403. Mounted over the template-generated file.
#
# use_default_settings.engines.remove keeps upstream defaults but drops the
# engines that hard-fail to load in this minimal image (torch, ahmia).
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: searxng
  labels:
    app: searxng
data:
  settings.yml: |
    use_default_settings:
      engines:
        remove:
          # needs the optional `torch` python package, absent from the image
          - torch
          # Tor hidden-service engine; useless without Tor connectivity
          - ahmia

    engines:
      # Extra general-web engines to widen fan-out (Tier 2 resilience):
      # the default engines (brave, duckduckgo, google cse, startpage) can be
      # IP-flagged by anti-bot, leaving the instance returning zero results;
      # more engines means a partial block degrades results instead of killing
      # search entirely.
      #
      # `disabled: false` is required, not decorative: these are `disabled:
      # true` in this image's base settings.yml, and a bare `- name: bing`
      # with no `disabled` key merges onto that default entry and *inherits*
      # disabled: true rather than resetting it. Confirmed live (2026-09-09)
      # that every entry here had been a silent no-op since #53 — /config
      # showed enabled: False for all four, and live pod logs showed zero
      # query attempts against them while duckduckgo/startpage/brave (the
      # actually-enabled defaults) were visibly getting hit.
      - name: bing
        disabled: false
      - name: yahoo
        disabled: false
      - name: qwant
        disabled: false
      - name: mojeek
        disabled: false
      # No plain `google` entry: confirmed against the running container
      # (not just upstream's GitHub master, which has since added one this
      # pinned image tag predates) that this build's engine registry has no
      # `google` entry at all — only google cse/news/scholar/play. `!go`
      # doesn't restrict a search the way a real shortcut does; it silently
      # falls through to the default set. google cse is the only Google path
      # this image has.

    search:
      # Hermes web_search provider requires JSON output (see provider.py:
      # /search?format=json). Default template is html-only -> 403.
      formats:
        - html
        - json
      # Explicit rather than inherited from upstream's default (currently 0 =
      # off): this is a research backend for an agent as much as a human, so
      # an upstream default change shouldn't silently start filtering results
      # nobody asked to have filtered. 0 = off, 1 = moderate, 2 = strict.
      safesearch: 0

    general:
      # Exposes Prometheus/OpenMetrics-format stats at /metrics, HTTP Basic
      # Auth gated (only the password is checked; username can be anything —
      # see docs.searxng.org/admin/settings/settings_general.html). Scraped
      # in-cluster only by the VMServiceScrape in vmservicescrape.yaml, which
      # targets the ClusterIP Service — never the tailnet-exposed path.
      #
      # There's no SEARXNG_OPEN_METRICS env-var override for this field
      # (checked against upstream settings.yml's documented `Is overwritten
      # by` list — only debug/port/bind_address/base_url/limiter/
      # public_instance/secret/image_proxy/method/valkey_url get one), so
      # the placeholder below is substituted with the real ESO/1Password
      # value by deployment.yaml's render-settings initContainer before the
      # main container ever reads this file — this ConfigMap itself never
      # holds the real password.
      open_metrics: "__OPEN_METRICS_PASSWORD__"
