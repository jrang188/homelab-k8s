# Provisions the `hermes-agent-dashboard-auth` Secret consumed by the
# Deployment's envFrom (deployment.yaml). The dashboard's auth gate engages
# automatically on any non-loopback bind and fails closed at startup without
# a registered auth provider — this is the same username/password mechanism
# Hermes Desktop's remote-connection mode expects, see
# https://hermes-agent.nousresearch.com/docs/user-guide/docker#running-the-dashboard.
# Sourced from 1Password via ESO's cluster-scoped `onepassword`
# ClusterSecretStore — see CONTEXT.md's secrets bootstrap contract and
# infra/eso.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-dashboard-auth
  namespace: hermes-agent
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-agent-dashboard-auth
  data:
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: hermes-agent-dashboard-auth/username
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: hermes-agent-dashboard-auth/password
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: hermes-agent-dashboard-auth/secret
