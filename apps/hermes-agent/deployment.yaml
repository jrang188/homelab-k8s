apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes-agent
  labels:
    app: hermes-agent
spec:
  replicas: 1
  # Single instance backed by a ReadWriteOnce PVC: Recreate avoids two pods
  # ever both trying to mount hermes-agent-data at once during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      # Home-node-only, per ADR-0002: the toleration admits the pod past the
      # home node's NoSchedule taint, the nodeSelector keeps it from landing
      # anywhere else.
      tolerations:
        - key: node-role.kubernetes.io/home
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeSelector:
        topology.kubernetes.io/zone: home
      # Sandboxes the `local` execution backend's agent-issued commands via
      # gVisor (infra/gvisor), per ADR-0003.
      runtimeClassName: gvisor
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:v2026.8.18
          imagePullPolicy: IfNotPresent
          # `gateway run` is the image's supervised main process (s6 keeps it
          # alive and, per HERMES_DASHBOARD=1, supervises the dashboard
          # alongside it in the same container — the two can't be split
          # across separate pods, since the dashboard's liveness detection
          # needs a shared PID namespace with the gateway). Hermes Desktop's
          # remote-connection mode talks to the dashboard, not the gateway's
          # own OpenAI-compatible API, so only that port is exposed here.
          # https://hermes-agent.nousresearch.com/docs/user-guide/docker#running-the-dashboard
          args:
            - gateway
            - run
          env:
            - name: HERMES_DASHBOARD
              value: "1"
          # HERMES_DASHBOARD_HOST/_PORT are left at their image defaults
          # (0.0.0.0:9119) — only reachable via the Tailscale-operator-exposed
          # Service (service.yaml), never a public Ingress.
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          envFrom:
            - secretRef:
                name: hermes-agent-dashboard-auth
          volumeMounts:
            - name: data
              mountPath: /opt/data
            # Playwright/Chromium (bundled, used for browser tools) needs
            # real shared memory — k8s defaults /dev/shm to 64Mi, equivalent
            # to Docker's default, not the documented `--shm-size=1g`.
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            tcpSocket:
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dashboard
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
