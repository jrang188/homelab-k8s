# Provisions the secrets consumed by the Authentik chart (values.yaml) and
# the bundled PostgreSQL subchart. Sourced from 1Password via ESO's
# cluster-scoped `onepassword` ClusterSecretStore — see CONTEXT.md's secrets
# bootstrap contract and infra/eso.
#
# Two Secrets are created:
#   * `authentik-config` — keys matching the AUTHENTIK_* env names the chart's
#     server/worker containers load via envFrom. The chart's own generated
#     config secret is skipped (authentik.existingSecret.secretName is set),
#     so this secret also carries the non-secret PostgreSQL connection
#     defaults the chart would otherwise have rendered (they're static and
#     harmless as literal values here; only the password is a genuine secret).
#   * `authentik-postgres-credentials` — the bitnami PostgreSQL subchart's
#     auth.existingSecret (key `password`, the `authentik` app user).
#
# Out-of-band setup: 1Password items (vault `Development`, matching infra/eso's
# ClusterSecretStore) with fields as referenced below. Until they exist these
# ExternalSecrets stay SecretSyncedError and the pods won't start — same
# pattern as cloudflare-api-token / tailscale-operator-oauth.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-config
  namespace: authentik
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-config
    template:
      mergePolicy: Merge
      data:
        # Non-secret connection defaults the chart would normally render into
        # its own config secret. Release name == dir basename == `authentik`,
        # so the bundled PostgreSQL subchart's headless service is
        # `authentik-postgresql`.
        AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
        AUTHENTIK_POSTGRESQL__NAME: authentik
        AUTHENTIK_POSTGRESQL__USER: authentik
        AUTHENTIK_POSTGRESQL__PORT: "5432"
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik/secret-key
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: authentik/postgres-password
    # Bootstrap superuser password so the initial admin user is created on
    # first boot (AUTHENTIK_BOOTSTRAP_* env vars are read by server/worker via
    # envFrom). Optional if you'd rather create the admin interactively.
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: authentik/bootstrap-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgres-credentials
  namespace: authentik
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-postgres-credentials
  data:
    - secretKey: password
      remoteRef:
        key: authentik/postgres-password