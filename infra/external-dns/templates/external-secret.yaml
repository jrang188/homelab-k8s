# Provisions the `cloudflare-api-token` Secret consumed by the external-dns
# subchart's CF_API_TOKEN env var (values.yaml). Sourced from 1Password via
# ESO's cluster-scoped `onepassword` ClusterSecretStore — see CONTEXT.md's
# secrets bootstrap contract and infra/eso.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-token/api-token
