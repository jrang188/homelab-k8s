# DNS-01 ClusterIssuer for Cloudflare, per ADR-0005. The Cloudflare API
# token comes from the `cloudflare-api-token` Secret provisioned by
# external-secret.yaml — never plaintext in git.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.acmeEmail | quote }}
    privateKeySecretRef:
      name: cloudflare-acme-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
