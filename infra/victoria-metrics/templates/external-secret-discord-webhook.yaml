# Provisions the `discord-webhook` Secret mounted into the alertmanager pod
# (alertmanager.spec.secrets in values.yaml) and referenced by
# webhook_url_file in alertmanager.config. Sourced from 1Password via ESO's
# cluster-scoped `onepassword` ClusterSecretStore — see CONTEXT.md's secrets
# bootstrap contract and infra/eso.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-webhook
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: discord-webhook
  data:
    - secretKey: webhook-url
      remoteRef:
        key: victoria-metrics-discord-webhook/webhook-url
