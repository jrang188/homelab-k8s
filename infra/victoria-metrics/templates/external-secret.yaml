# Provisions the `grafana-admin` Secret referenced by
# grafana.admin.existingSecret in values.yaml, so the chart's own
# self-generated admin-password Secret is never created — see
# https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/#grafana-password-changes-constantly
# Sourced from 1Password via ESO's cluster-scoped `onepassword`
# ClusterSecretStore — see CONTEXT.md's secrets bootstrap contract and
# infra/eso.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: victoria-metrics-grafana-admin/admin-user
    - secretKey: admin-password
      remoteRef:
        key: victoria-metrics-grafana-admin/admin-password
