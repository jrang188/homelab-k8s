## VictoriaMetrics k8s stack configuration
## Ref: https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/
##
## Only overrides from the victoria-metrics-k8s-stack chart's own defaults
## belong here. Everything else falls through to the chart's built-in values.

victoria-metrics-k8s-stack:
  # The control planes are small (~3GiB) Hetzner VMs already running tight
  # on memory from k3s/etcd/apiserver/scheduler/controller-manager overhead
  # alone. Pin the heavier stack components to the home node (which has
  # ample headroom) to avoid piling more onto an already-constrained
  # control plane. node-exporter stays unpinned/DaemonSet — it must run on
  # every node to read that node's own /proc and /sys.
  vmagent:
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: home
      tolerations:
        - key: node-role.kubernetes.io/home
          operator: Equal
          value: "true"
          effect: NoSchedule

  grafana:
    admin:
      # Precreated Secret (provisioned by templates/external-secret.yaml from
      # ESO's `onepassword` ClusterSecretStore) instead of the chart's default
      # self-generated admin-password Secret. Without this, ArgoCD's
      # repo-server renders the chart without cluster access, so the chart's
      # lookup-based reuse guard (see grafana.password in the upstream chart)
      # never finds the existing Secret and mints a new random password on
      # every manual sync — see
      # https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/#grafana-password-changes-constantly
      existingSecret: grafana-admin
    # The VictoriaMetrics/VictoriaLogs datasources provisioned below
    # (defaultDatasources.victoriametrics/.victorialogs) reference plugin
    # types Grafana doesn't ship built-in — without these, Grafana logs
    # "Could not find plugin definition for data source" and the
    # datasources never appear in the UI at all. Requires the Grafana pod
    # to have internet access at startup to fetch them.
    plugins:
      - victoriametrics-metrics-datasource
      - victoriametrics-logs-datasource
    nodeSelector:
      topology.kubernetes.io/zone: home
    tolerations:
      - key: node-role.kubernetes.io/home
        operator: Equal
        value: "true"
        effect: NoSchedule

    # Operator-only tool — deliberately NOT on the public Traefik/
    # Cloudflare path. ingressClassName: tailscale puts this on the
    # tailnet only (MagicDNS name + Tailscale-issued TLS cert), same
    # policy as Hermes Agent (see CONTEXT.md) and ArgoCD. Only apps meant
    # to be shown off publicly should ever get ingressClassName: traefik
    # + a cert-manager/cloudflare annotation.
    ingress:
      enabled: true
      ingressClassName: tailscale
      hosts:
        - grafana
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana

  kube-state-metrics:
    nodeSelector:
      topology.kubernetes.io/zone: home
    tolerations:
      - key: node-role.kubernetes.io/home
        operator: Equal
        value: "true"
        effect: NoSchedule

  # VictoriaLogs, folded into this chart's own vlsingle CRD instead of the
  # separate infra/victoria-logs release — enabling it also auto-wires a
  # Grafana datasource (defaultDatasources.victorialogs), no manual
  # datasource entry needed.
  vlsingle:
    enabled: true
    spec:
      # 7-day log retention (ADR-0008).
      retentionPeriod: "7d"
      storage:
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
      # Home-node-only, same rationale as vmsingle below.
      nodeSelector:
        topology.kubernetes.io/zone: home
      tolerations:
        - key: node-role.kubernetes.io/home
          operator: Equal
          value: "true"
          effect: NoSchedule

  # Actual log collector — tails each node's local container logs
  # (k8sCollector, enabled by the chart's own default) and forwards them
  # to vlsingle. Left unpinned/no nodeSelector deliberately: it has to run
  # on every node (DaemonSet-style, same reason as node-exporter), since a
  # home-node-only nodeSelector would silently drop every control plane's
  # logs.
  vlagent:
    enabled: true
    spec:
      # /var/log/containers/*.log symlinks to root-owned (0750) files
      # under /var/log/pods/*; the vlagent image runs as a non-root UID
      # by default, hence runAsUser. On the three Hetzner control planes
      # (k3s runs with --selinux=true on openSUSE Leap Micro; confirmed
      # via `k3s.io/node-args` on the Node object) runAsUser alone still
      # gets "permission denied" — SELinux confines pods to container_t,
      # which can't read /var/log/pods/** regardless of DAC/capabilities.
      # spc_t (super-privileged container type, the standard SELinux
      # type for host-log-reading DaemonSets) is what actually lifts it;
      # verified live with a throwaway debug pod before landing this.
      # The home node (NixOS, no SELinux) doesn't need it but is
      # unaffected by setting it either way.
      securityContext:
        runAsUser: 0
        seLinuxOptions:
          type: spc_t
      # No toleration means the DaemonSet controller skips the home node
      # entirely (its NoSchedule taint repels untolerated pods regardless
      # of nodeSelector) — same blanket toleration node-exporter uses so
      # every node, including home, actually gets a collector.
      tolerations:
        - operator: Exists
          effect: NoSchedule

  # k3s runs etcd, the scheduler, and the controller-manager in-process
  # inside the single k3s server binary, not as separate kubeadm-style
  # static pods carrying component=etcd/kube-scheduler/kube-controller-manager
  # labels. The chart's Services/VMServiceScrapes for these assume kubeadm
  # and never find a matching pod on this cluster, so left enabled they'd
  # sit at zero endpoints permanently and (with vmalert) fire *Down alerts
  # that can never resolve.
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false

  vmalert:
    enabled: true
    spec:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
      nodeSelector:
        topology.kubernetes.io/zone: home
      tolerations:
        - key: node-role.kubernetes.io/home
          operator: Equal
          value: "true"
          effect: NoSchedule
      # The chart auto-derives external.url (used to build the "Source"
      # link on every alert notification) from grafana.ingress.hosts[0]
      # verbatim — just "grafana", with no ts.net suffix. That's correct
      # for a normal Ingress class, but the tailscale ingress class treats
      # `hosts: [grafana]` as a MagicDNS short name, not the full address;
      # the real reachable/cert-valid hostname is grafana.tail8255cc.ts.net.
      # Left as the chart's default, every alert link in Discord points
      # somewhere that doesn't resolve/TLS-validate off-tailnet.
      extraArgs:
        external.url: "https://grafana.tail8255cc.ts.net"

  alertmanager:
    enabled: true
    # Without this, the chart's fullname helper produces
    # "victoria-metrics-victoria-metrics-k8s-stack" (this release is named
    # "victoria-metrics", same as the chart's own name prefix, and the two
    # don't get deduped here). vmsingle/vlsingle use a short enough
    # resource-type prefix that this still barely fits in a label value;
    # vmalertmanager's longer prefix pushes the StatefulSet's
    # controller-revision-hash label past Kubernetes' 63-byte cap and pods
    # fail to create. Shortened name sidesteps it.
    name: "alertmanager"
    spec:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
      nodeSelector:
        topology.kubernetes.io/zone: home
      tolerations:
        - key: node-role.kubernetes.io/home
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Mounts the `discord-webhook` Secret (provisioned by
      # templates/external-secret-discord-webhook.yaml from 1Password) at
      # /etc/vm/secrets/discord-webhook/ — referenced below via
      # webhook_url_file so the webhook URL never lands in this values.yaml
      # or the rendered config Secret's own values, only in the mounted file.
      secrets:
        - discord-webhook
    # Single real receiver for a single-person homelab: everything at
    # warning/critical goes to the one Discord channel. group_by keeps a
    # noisy group (e.g. every pod in a crashlooping Deployment) as one
    # notification instead of one-per-pod.
    #
    # info-severity alerts route to `blackhole` instead — the default rule
    # set has plenty of these (replica-count cosmetics, etc.) that aren't
    # worth a phone notification for a solo operator.
    config:
      route:
        receiver: discord
        group_by: ["alertname", "namespace"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: blackhole
            matchers:
              - severity = info
      receivers:
        - name: discord
          discord_configs:
            - webhook_url_file: /etc/vm/secrets/discord-webhook/webhook-url
              send_resolved: true
        - name: blackhole

  # defaultRules ships upstream kube-prometheus-stack-style alert groups for
  # components this cluster doesn't run as scrapeable targets (see
  # kubeEtcd/kubeScheduler/kubeControllerManager above — k3s runs these
  # in-process, not as separate pods the chart's scrape config can find).
  # Left enabled, these groups' alerts would key off metrics that never
  # exist and — now that vmalert/alertmanager actually notify — fire
  # permanently-unresolved false positives straight to Discord.
  defaultRules:
    groups:
      etcd:
        enabled: false
      kube-scheduler.rules:
        enabled: false
      kubernetes-system-scheduler:
        enabled: false
      kubernetes-system-controller-manager:
        enabled: false
      # SLO burn-rate alerting on the apiserver error budget — designed for
      # tracking multi-9s production SLAs over real traffic volume.
      # Meaningless noise on a single low-traffic k3s apiserver at this
      # scale.
      kube-apiserver-slos:
        enabled: false
      kube-apiserver-burnrate.rules:
        enabled: false
      kube-apiserver-histogram.rules:
        enabled: false
    # Per-alert overrides for defaults that are broadly known to be
    # low-signal/homelab-inappropriate even when the underlying metrics
    # exist and are being scraped correctly.
    rules:
      # Fires on totally normal, harmless CPU throttling under cgroups v2;
      # notoriously noisy even in production fleets, not worth a homelab
      # phone notification.
      CPUThrottlingHigh:
        enabled: false
      # A homelab is *meant* to run overcommitted — these would fire
      # constantly on a 3-node Hetzner CX23 cluster + one home box and
      # convey nothing actionable.
      KubeCPUOvercommit:
        enabled: false
      KubeMemoryOvercommit:
        enabled: false

  vmsingle:
    spec:
      # 30-day metrics retention (ADR-0008).
      retentionPeriod: "30d"
      storage:
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
      # Home-node-only: the TSDB must run on the node that owns the disk.
      # Toleration admits it past the home-node NoSchedule taint; the
      # nodeSelector pins it to the labelled home node. See ADR-0002/0007.
      nodeSelector:
        topology.kubernetes.io/zone: home
      tolerations:
        - key: node-role.kubernetes.io/home
          operator: Equal
          value: "true"
          effect: NoSchedule
