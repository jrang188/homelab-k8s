# Provisions the `operator-oauth` Secret the tailscale-operator chart expects
# in its own release namespace when oauth.clientId/oauth.clientSecret are left
# unset in values.yaml (see oauth-secret.yaml in the upstream chart). Sourced
# from 1Password via ESO's cluster-scoped `onepassword` ClusterSecretStore —
# see CONTEXT.md's secrets bootstrap contract and infra/eso.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-operator-oauth/client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale-operator-oauth/client_secret
